<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests decide whether the code works. The decision model (Jev) recommends how much human attention it needs.</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">design · verifying the work</p>
    <h1>Tests decide whether the code works. The decision model (Jev) recommends how much human attention it needs.</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="verification-title verification-desc">
        <title id="verification-title">Tests decide whether the code works. The decision model (Jev) recommends how much human attention it needs.</title>
        <desc id="verification-desc">Verifying the work, container by container: in the Plan container the analyst (Pi + LLM, at most two attempts) writes the plan and the hidden tests, which live in the S3 bucket under hidden/, and the gate before, without an LLM, runs them on main as the sandbox user, where they must fail, otherwise the work goes back to the analyst; in the Build container the implementer writes the code without access to the hidden tests and pushes its own mork/* branch with a scoped token; in the Check container the gate after, without an LLM, runs the repo tests, the hidden tests and the diff policy on the pushed commit, on failure returns the work to Build (at most three attempts), and only once it passes does the reviewer assess the diff and the untestable criteria; the decision model (Jev) then assesses the untestable criteria live and, based on the evidence, recommends one of three levels of human attention: a quick look (draft PR with review:quick), a careful review (draft PR with review:careful), which is also the safe default when its confidence is below 0.8, or a human takeover (needs-human), and hard rules can only raise the level.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <text x="152" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PLAN CONTAINER</text>

        <text x="776" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CHECK CONTAINER</text>

        <text x="136" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">analyst</text>
        <text x="136" y="291" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Pi + LLM · ≤2 attempts</text>
        <text x="136" y="303" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">plan + hidden tests</text>

        <text x="876" y="303" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ diff policy · pushed commit</text>
