  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */

      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

        <desc id="workflow-desc">The mork workflow in Step Functions, left to right: the Start Lambda takes a task from GitHub (the factory label) or from Slack (@mork; it finds or creates the Jira issue), sets labels, runs triage, stores issue.json in S3 and checks the config; the Route Choice state sends the run on to Plan or, when the issue is clearly unclear (p ≤ 0.2), straight to Done once Start has posted clarifying questions from the LLM to the issue and added the needs-info label, so no container starts; the Plan container runs the analyst (Pi + LLM, at most two attempts) and the gate before, without an LLM, as the sandbox user, where the hidden tests must fail on main; the Build container runs the implementer, the only phase without access to the hidden tests, at most three times, and the implementer pushes its own factory/* branch with a scoped token, the guard allows it only git push origin to its own branch without force, and the runner verifies that its last commit is on GitHub; the Check container runs the gate after on the pushed commit with the repo tests, the hidden tests and the diff policy, and the reviewer only once the gate passes; the Decide Lambda opens a draft PR only if the branch still points at the commit that passed the gate, or on a gate failure returns the work to Build; the decision model (Jev) decides live with thresholds that are not calibrated yet: triage in Start, supervision every 45 s of the analyst, the implementer and the reviewer, and in Decide the untested criteria and the review level, and every decision goes to the mork-timeline DynamoDB table; the containers have no turn or time limits, the brakes are supervision and the 2 h phase timeout; an error in any state is caught by Catch into the Handover Lambda (comment, needs-human, stopping the containers) and both paths end in Done. All three containers are one image, mork-runner; Step Functions starts them via runTask with a task token and waits for the callback; the execution carries only a small brief and the outputs live in S3.</desc>

        <text x="40" y="578" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Start → Route → Plan. When the issue is clearly unclear (p ≤ 0.2), Start posts clarifying questions from the LLM to the issue and adds the needs-info label; the Route Choice state ends the run in Done with no container.</text>
        <text x="40" y="594" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">The implementer pushes its own branch with a scoped token; the runner verifies that its last commit is on GitHub, Check verifies that the gate tested exactly that commit, and Decide opens the PR only if the branch still points at it.</text>
        <text x="40" y="610" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">The decision model (Jev) decides live: triage in Start, supervision of every LLM station in Plan, Build and Check (every 45 s: worker_stuck → steer → stop), and in Decide the untested criteria and the review level.</text>
        <text x="40" y="626" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Thresholds are not calibrated yet; every decision goes to the mork-timeline DynamoDB table. Containers have no turn or time limits; the brakes are supervision and the 2 h phase timeout with a heartbeat.</text>
