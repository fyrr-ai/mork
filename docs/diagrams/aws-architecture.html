        <title id="aws-architecture-title">Mork on AWS: Step Functions and three phases on Fargate</title>
        <desc id="aws-architecture-desc">The deployed Mork v1 architecture in an AWS account managed by the Terraform module infra/aws: tasks arrive from two sources, a GitHub webhook (the mork label) is received by the intake Lambda through a Function URL with HMAC and trust verification, and an @mork mention in Slack is received by the slack Lambda through its own Function URL with a verified signature, and both start the mork state machine in Step Functions, which owns ordering, retries and timeouts and itself starts the Plan, Build and Check phases (one image, mork-runner, three task definitions on Fargate in the private subnets of the VPC) through ecs:runTask with a task token and waits for their callback; the phases clone the repository, Build pushes its own mork/* branch with a scoped token, they call the LLM with a key from Secrets Manager, the runner supervises every LLM station through the decision model (Jev), and phase outputs are read and written in one Mork S3 bucket, so the execution carries only a small brief; the steps Lambda handles the Start (triage; for Slack it finds or creates the Jira issue), Decide and Handover steps, reads the outputs from the bucket, has Jev assess the criteria and the review level live, opens a draft PR only for the commit that passed the gate, or hands the work to a human, and reports progress to GitHub or to the Slack thread and to Jira.</desc>
