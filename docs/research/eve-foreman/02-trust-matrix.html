    <h1>Who may do what: three caller classes</h1>
    <p class="subtitle">Trust is stamped by the channel at dispatch (signed webhook), never by the prompt. The predicates in <code>agent/lib/github/approval.ts</code> return one of three outcomes for each action: RUN, APPROVAL, or DENIED.</p>
