<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where things run and how credentials flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">eve software factory · runtime</p>
    <h1>Where things run and how credentials flow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="03-architecture-title 03-architecture-desc">
        <title id="03-architecture-title">Where things run and how credentials flow</title>
        <desc id="03-architecture-desc">Architecture of the Foreman agent on Vercel: events from GitHub and Linear enter through Channels and reach Foreman, which launches the Stations subagents isolated in Vercel Sandbox and stores state in Vercel Blob; the token from Vercel Connect is added only by the firewall on egress to GitHub, so it never enters the sandbox.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ZONES (bg → zones → arrows → nodes) ============ -->
        <!-- Zone: Vercel project -->
        <rect x="232" y="116" width="1008" height="476" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="248" y="120" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="252" y="129" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERCEL PROJECT</text>

        <!-- Zone: Vercel Sandbox (trust boundary, dashed) -->
        <rect x="760" y="148" width="288" height="268" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="776" y="152" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="780" y="161" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERCEL SANDBOX (ISOLATION)</text>

        <!-- ============ ARROWS ============ -->
        <!-- GitHub → Channels: WEBHOOK (bottom port, enters Channels left edge) -->
        <path d="M 120,256 V 320 Q 120,328 128,328 H 264"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Linear → Channels: AGENT SESSION -->
        <path d="M 120,432 V 368 Q 120,360 128,360 H 264"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Channels → Foreman: AUTH STAMP -->
        <line x1="424" y1="344" x2="504" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Foreman → Stations: RUN_<ID> -->
        <line x1="684" y1="344" x2="784" y2="344" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Foreman ↔ Vercel Blob: BRAIN (read + write) -->
        <line x1="594" y1="376" x2="594" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow-start)" marker-end="url(#arrow)"/>
        <!-- Stations → Vercel Blob: ARTIFACTS -->
        <path d="M 904,392 V 528 Q 904,536 896,536 H 684"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Foreman → GitHub: DRAFT PR (API) -->
        <path d="M 560,312 V 244 Q 560,236 552,236 H 200"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Stations → Firewall egress: GIT PUSH (inside sandbox) -->
        <line x1="904" y1="296" x2="904" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Firewall egress → GitHub: GIT PUSH (feature branch, token in header) -->
        <line x1="784" y1="212" x2="200" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Vercel Connect → Firewall egress: TOKEN -->
        <line x1="1084" y1="212" x2="1024" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ ARROW LABELS (masked, 6px gap) ============ -->
        <rect x="172" y="310" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="196" y="319" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WEBHOOK</text>

        <rect x="156" y="366" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="196" y="375" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGENT SESSION</text>

        <rect x="432" y="326" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTH STAMP</text>

        <rect x="708" y="326" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="734" y="335" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN_&lt;ID&gt;</text>

        <rect x="602" y="434" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="620" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRAIN</text>

        <rect x="760" y="518" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="790" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ARTIFACTS</text>

        <rect x="354" y="242" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="380" y="251" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRAFT PR</text>

        <rect x="654" y="194" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="203" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT PUSH</text>

        <rect x="1036" y="194" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1054" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>

        <!-- ============ NODES ============ -->
        <!-- Node: GitHub (external) -->
        <rect x="40" y="192" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="192" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="48" y="198" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="62" y="207" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="120" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub</text>
        <text x="120" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">issues · PR · check_suite</text>

        <!-- Node: Linear (external) -->
        <rect x="40" y="432" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="432" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="48" y="438" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="62" y="447" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="120" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linear</text>
        <text x="120" y="486" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Agent Sessions · MCP</text>

        <!-- Node: Channels (backend) -->
        <rect x="264" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="272" y="318" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="286" y="327" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
        <text x="344" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Channels</text>
        <text x="344" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">github.ts · linear.ts</text>
        <text x="344" y="369" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trust stamp</text>

        <!-- Node: Foreman (focal) -->
        <rect x="504" y="312" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="312" width="180" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="512" y="318" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="528" y="327" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="594" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Foreman</text>
        <text x="594" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root agent · github__* tools</text>

        <!-- Node: Stations (backend, inside sandbox) -->
        <rect x="784" y="296" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="784" y="296" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="792" y="302" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="806" y="311" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">×5</text>
        <text x="904" y="334" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stations</text>
        <text x="904" y="350" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">classifier · analyst · implementer</text>
        <text x="904" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviewer · researcher</text>
        <text x="904" y="378" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 subagents · own clone</text>

        <!-- Node: Firewall egress (security boundary, second accent) -->
        <rect x="784" y="180" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="784" y="180" width="240" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="792" y="186" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="812" y="195" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EGRESS</text>
        <text x="904" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firewall egress</text>
        <text x="904" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">token in header only</text>

        <!-- Node: Vercel Connect (backend, outside sandbox) -->
        <rect x="1084" y="180" width="140" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1084" y="180" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1092" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1108" y="195" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="1154" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel Connect</text>
        <text x="1154" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">OAuth /</text>
        <text x="1154" y="239" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">installation token</text>

        <!-- Node: Vercel Blob (store) -->
        <rect x="504" y="504" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="504" width="180" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="512" y="510" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="530" y="519" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="594" y="542" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vercel Blob</text>
        <text x="594" y="558" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">brain · artifacts · prefs</text>

        <!-- ============ CALLOUTS (margins, italic serif) ============ -->
        <!-- Callout 1: token never enters the sandbox → lands on Firewall egress -->
        <text x="1240" y="56" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">The token never enters the sandbox: the firewall adds it as a header</text>
        <text x="1240" y="74" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">only on egress to github.com and then strips it again.</text>
        <path d="M 1100 84 Q 1010 100 1004 176" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1004" cy="180" r="2" fill="#2d3142"/>

        <!-- Callout 2: push_branch guard → lands on GIT PUSH path -->
        <text x="40" y="56" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">push_branch refuses main, master, refs/* and HEAD;</text>
        <text x="40" y="74" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">a branch alone ships nothing.</text>
        <path d="M 300 84 Q 420 96 440 208" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="440" cy="212" r="2" fill="#2d3142"/>

        <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
