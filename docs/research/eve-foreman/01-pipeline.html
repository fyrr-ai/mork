<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Foreman runs a task through four stations</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">eve software factory · pipeline</p>
    <h1>How Foreman runs a task through four stations</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="01-pipeline-title 01-pipeline-desc">
        <title id="01-pipeline-title">How Foreman runs a task through four stations</title>
        <desc id="01-pipeline-desc">Flowchart of the eve software factory: the Foreman orchestrator calls the stations in turn (classifier, optionally researcher, analyst, implementer, reviewer); an unclear request ends with a question; the reviewer may send work back to the implementer at most twice; and an approved result ends as a draft PR that a human marks ready and merges.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Arrows (drawn first, behind nodes) ============ -->
        <!-- Foreman → classifier -->
        <line x1="224" y1="288" x2="288" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- classifier → Ask and stop (bottom edge) -->
        <line x1="368" y1="320" x2="368" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- classifier → researcher (top edge, optional, dashed) -->
        <path d="M 368 256 V 136 Q 368 128 376 128 H 404" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- researcher → analyst (optional, dashed) -->
        <path d="M 564 128 H 594 Q 602 128 602 136 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- classifier → analyst -->
        <line x1="448" y1="288" x2="512" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- analyst → implementer -->
        <line x1="692" y1="288" x2="756" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- implementer → reviewer -->
        <line x1="996" y1="288" x2="1060" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- reviewer → implementer (loop-back over the top) -->
        <path d="M 1150 256 V 224 Q 1150 216 1142 216 H 884 Q 876 216 876 224 V 256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- reviewer → Draft PR -->
        <line x1="1150" y1="320" x2="1150" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Draft PR → Human -->
        <line x1="1150" y1="448" x2="1150" y2="512" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ Arrow labels (opaque masks, 8px gap) ============ -->
        <!-- UNCLEAR: beside vertical x=368, right side -->
        <rect x="376" y="354" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="398" y="363" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UNCLEAR</text>
        <!-- OPTIONAL: beside vertical x=368, left side -->
        <rect x="304" y="190" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="332" y="199" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OPTIONAL</text>
        <!-- OK -->
        <rect x="468" y="268" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>
        <!-- PLAN -->
        <rect x="708" y="268" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="724" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PLAN</text>
        <!-- BRANCH -->
        <rect x="1008" y="268" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1028" y="277" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BRANCH</text>
        <!-- CHANGES ≤2× on loop top segment y=216 -->
        <rect x="978" y="196" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1012" y="205" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHANGES ≤2×</text>
        <!-- APPROVE: beside vertical x=1150, right side -->
        <rect x="1158" y="350" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1180" y="359" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE</text>

        <!-- ============ Nodes ============ -->
        <!-- Foreman (focal #1) -->
        <rect x="44" y="256" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="256" width="180" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="52" y="262" width="28" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="66" y="271" fill="rgba(191,69,32,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORCH</text>
        <text x="134" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Foreman</text>
        <text x="134" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">orchestrator · writes no code</text>

        <!-- classifier -->
        <rect x="288" y="256" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="256" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="262" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1/4</text>
        <text x="368" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">classifier</text>
        <text x="368" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">text only · type/priority</text>

        <!-- Ask and stop (terminal) -->
        <rect x="288" y="400" width="160" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="288" y="400" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="368" y="425" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ask and stop</text>
        <text x="368" y="441" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">needs_clarification</text>

        <!-- researcher (optional) -->
        <rect x="404" y="96" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="404" y="96" width="160" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="412" y="102" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="426" y="111" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
        <text x="484" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">researcher</text>
        <text x="484" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web · cited sources</text>

        <!-- analyst -->
        <rect x="512" y="256" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="256" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="520" y="262" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="534" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">2/4</text>
        <text x="602" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">analyst</text>
        <text x="602" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own checkout · plan + AC</text>

        <!-- implementer -->
        <rect x="756" y="256" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="756" y="256" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="764" y="262" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="778" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">3/4</text>
        <text x="876" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">implementer</text>
        <text x="876" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">own sandbox · push factory/*</text>

        <!-- reviewer -->
        <rect x="1060" y="256" width="180" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1060" y="256" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1068" y="262" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="1082" y="271" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">4/4</text>
        <text x="1150" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">reviewer</text>
        <text x="1150" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">other vendor · real diff</text>

        <!-- Draft PR -->
        <rect x="1060" y="392" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1060" y="392" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="1150" y="417" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Draft PR</text>
        <text x="1150" y="433" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">draft: true</text>

        <!-- Human (focal #2, human gate) -->
        <rect x="1060" y="512" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="1060" y="512" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="1150" y="537" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Human</text>
        <text x="1150" y="553" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ready + merge</text>

        <!-- ============ Callouts (italic serif, dashed leaders) ============ -->
        <!-- Callout 1: self-contained messages, pointing at the PLAN hand-off -->
        <text x="724" y="392" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Stations inherit nothing from Foreman: every message must be self-contained,</text>
        <text x="724" y="410" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">long documents travel through Blob as an artifact id.</text>
        <path d="M 720 374 Q 740 334 724 292" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="724" cy="288" r="2" fill="#2d3142"/>

        <!-- Callout 2: failed reviews, pointing at the loop-back -->
        <text x="1240" y="120" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">After 2 failed reviews no PR is opened;</text>
        <text x="1240" y="138" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="end">Foreman reports the unresolved findings.</text>
        <path d="M 1128 148 Q 1132 188 1104 214" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="1104" cy="216" r="2" fill="#2d3142"/>

        <!-- ============ Legend (bottom strip) ============ -->
        <line x1="44" y1="660" x2="1240" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="44" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="44" y="688" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="76" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal point</text>

        <rect x="224" y="688" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="256" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Step / station</text>

        <rect x="404" y="688" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="436" y1="694" x2="464" y2="694" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="472" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Optional / async</text>

        <rect x="620" y="688" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="652" y="698" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Terminal (end)</text>
      </svg>
    </div>
  </div>
</body>
</html>
