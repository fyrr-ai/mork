# Slack app for Mork. Create it at https://api.slack.com/apps → "From a
# manifest". The request URL is the `slack_events_url` output of the
# Terraform module in infra/aws. Replace the example request URL below.
# The bot token (xoxb-…) and the signing
# secret go to Secrets Manager: mork/slack-bot-token and
# mork/slack-signing-secret.
display_information:
  name: mork
  description: Mork turns a request in Slack into a tracked issue and a verified draft PR
features:
  bot_user:
    display_name: mork
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://example.com/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
