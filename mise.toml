[tools]
node = "24.21.0"
bun = "1.4.2"
opentofu = "1.12.6"
jq = "1.8.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
gitleaks = "8.30.1"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Deployment-specific values (AWS_PROFILE, AWS_REGION, MORK_ACCOUNT, MORK_NAME…) belong in
# mise.local.toml, which is not committed. See docs/deployment.md.
# Avoid IMDS probes when the AWS CLI runs outside EC2.
AWS_EC2_METADATA_DISABLED = "true"

[tasks.install]
description = "Install workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Unit tests"
run = "bun test packages scripts"

[tasks.typecheck]
description = "Type-check every package"
run = "for p in packages/*; do tsc -p \"$p\" --noEmit || exit 1; done"

[tasks.lint]
description = "Biome lint and format check"
run = "biome check packages scripts images"

[tasks.check]
description = "Everything CI should run"
depends = ["test", "typecheck", "lint", "scripts:check", "infra:check", "infra:test"]

[tasks."images:build"]
description = "Build the runner, egress and lambda images locally"
run = "for t in ${MORK_IMAGE_TARGETS:-runner egress lambda}; do case $t in runner|egress) platform=linux/arm64 ;; lambda) platform=linux/amd64 ;; *) echo Invalid image target >&2; exit 1 ;; esac; docker build --platform $platform --target $t --load -t mork-$t:dev . || exit 1; done"

[tasks."images:check"]
description = "Build and smoke-test production entrypoints and image notices without runtime network"
depends = ["images:build"]
run = "scripts/check-images.sh"

[tasks.deploy]
description = "Upload images and apply a validated Terraform plan with pinned runtime versions"
run = "scripts/deploy.sh"

[tasks."deploy:soci"]
description = "Deploy SOCI v2 runner and egress images; Lambda stays a plain image (uses AWS)"
run = "mise exec aqua:awslabs/soci-snapshotter@0.16.1 aqua:google/go-containerregistry@0.22.1 -- scripts/deploy.sh --soci"

[tasks."images:push:soci"]
description = "Upload initial SOCI v2 phase images and a plain Lambda image (uses AWS)"
run = "mise exec aqua:awslabs/soci-snapshotter@0.16.1 aqua:google/go-containerregistry@0.22.1 -- scripts/deploy.sh --images-only --soci"

[tasks."soci:publish"]
description = "Convert and publish an OCI archive/layout as SOCI v2 (writes the supplied registry)"
run = "mise exec aqua:awslabs/soci-snapshotter@0.16.1 aqua:google/go-containerregistry@0.22.1 -- scripts/soci-publish.sh"

[tasks."test:soci"]
description = "Prove SOCI v2 conversion and publication against a local registry, without AWS"
run = "mise exec aqua:awslabs/soci-snapshotter@0.16.1 aqua:google/go-containerregistry@0.22.1 -- bun scripts/soci.runtime.ts"

[tasks."soci:builder"]
description = "Create a named Buildx builder for OCI exports when the current builder cannot export OCI"
run = "if ! docker buildx inspect mork-soci >/dev/null 2>&1; then docker buildx create --name mork-soci --driver docker-container; fi"

[tasks."secrets:put"]
description = "Create or update the Mork secrets in Secrets Manager"
run = "scripts/aws-secrets.sh"

[tasks."e2e:watch"]
description = "Follow the newest (or given) Step Functions execution"
run = "scripts/watch-execution.sh"

[tasks."timeline:export"]
description = "Export one decision point from the timeline as jevcal JSONL (usage: mise run timeline:export -- recommendation > data.jsonl)"
run = "bun packages/timeline/src/cli.ts"

[tasks."rulesets:apply"]
description = "Apply the default-branch and agent-branch rulesets to a repository (usage: mise run rulesets:apply -- owner/repo)"
run = "scripts/rulesets.sh"

[tasks."scripts:check"]
description = "Check shell syntax, shellcheck and GitHub Actions"
run = "for file in scripts/*.sh images/*.sh images/egress/entrypoint.sh; do bash -n \"$file\" || exit 1; done; shellcheck scripts/*.sh images/*.sh images/egress/entrypoint.sh && actionlint"

[tasks."infra:init"]
description = "Initialize the module locally without an AWS backend"
run = "tofu -chdir=infra/aws init -backend=false -input=false -lockfile=readonly"

[tasks."infra:check"]
description = "Format and validate the OpenTofu module without AWS calls"
depends = ["infra:init"]
run = "tofu -chdir=infra/aws fmt -check -recursive && tofu -chdir=infra/aws validate"

[tasks."infra:fmt"]
description = "Format the OpenTofu module"
run = "tofu -chdir=infra/aws fmt -recursive"

[tasks."infra:bootstrap"]
description = "Create ECR repositories for the first image upload (uses AWS)"
run = "tofu -chdir=${MORK_INFRA_DIR:-infra/aws/examples/basic} apply -target=module.mork.aws_ecr_repository.this"

[tasks."infra:apply"]
description = "Apply a configured deployment (uses AWS)"
run = "scripts/apply.sh"

[tasks."images:push"]
description = "Build and upload images before creating Lambda functions (uses AWS)"
run = "scripts/deploy.sh --images-only"

[tasks."gate:local"]
description = "Run the real gate on a local git checkout without AWS"
run = "bun packages/runner/src/gate-cli.ts"

[tasks."workflow:local"]
description = "Run the complete workflow against local adapters without AWS"
run = "bun packages/runner/src/local-cli.ts"

[tasks."workflow:configured"]
description = "Run a configured workflow locally without AWS"
run = "bun packages/runner/src/workflow-local-cli.ts"

[tasks."security:scan"]
description = "Scan committed content and history for secrets"
run = "gitleaks git --redact --log-opts=HEAD ."

[tasks."release:export"]
description = "Export committed HEAD into a new single-commit repository (no push)"
run = "scripts/release-export.sh"

[tasks."infra:test"]
description = "Plan regression tests with mocked AWS; no account or deployment"
depends = ["infra:init"]
run = "bun scripts/infra-test.ts"

[tasks."test:sandbox"]
description = "Build and run privilege-boundary tests in Docker without runtime network"
run = "scripts/test-sandbox.sh"
