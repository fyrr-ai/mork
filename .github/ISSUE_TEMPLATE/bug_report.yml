name: Bug report
description: Report a reproducible defect. Report vulnerabilities privately through SECURITY.md.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the trigger and what happened. Remove tokens, account identifiers, private source and session transcripts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest example and commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the Mork commit, tool versions, deployment configuration relevant to the defect and sanitized error output.
    validations:
      required: true
